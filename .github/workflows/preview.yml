name: Preview Deployment

# Runs on every pull request targeting main.
# Validates the build, then deploys a per-PR preview to Vercel.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancel in-flight runs for the same PR when a new commit is pushed.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Job 1: CI checks ────────────────────────────────────────────────────────
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Run tests
        run: npx jest --passWithNoTests

      # Build the Docker image to validate the production build in a clean,
      # isolated environment that mirrors deployment exactly.
      - name: Build Docker image (production build validation)
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://example.com' }} \
            -t expense-tracker:pr-${{ github.event.pull_request.number }} \
            .

  # ── Job 2: Deploy preview to Vercel ─────────────────────────────────────────
  deploy-preview:
    name: Deploy Preview to Vercel
    runs-on: ubuntu-latest
    needs: ci

    # Allow this job to post a comment back to the PR
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Pull project settings and environment variables from Vercel.
      # This requires VERCEL_ORG_ID and VERCEL_PROJECT_ID to be set as
      # GitHub repository secrets.
      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Build using Vercel's build system (not Docker — Docker was the
      # validation step only). Vercel handles serverless packaging here.
      - name: Build project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$url" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Post preview URL to PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview_url }}';
            const sha  = context.payload.pull_request.head.sha.substring(0, 7);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo:  context.repo.repo,
              body: [
                '## Preview Deployment Ready',
                '',
                `**URL:** ${url}`,
                `**Commit:** \`${sha}\``,
                '',
                '_This preview updates automatically on every new push to this PR._',
              ].join('\n'),
            });
