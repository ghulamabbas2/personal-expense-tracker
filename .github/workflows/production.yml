name: Production Deployment

# Runs on every push to main (i.e., after a PR is merged).
# Direct pushes to main are blocked by branch protection rules — all changes
# must arrive via a reviewed, CI-passing pull request.
on:
  push:
    branches: [main]

# Prevent concurrent production deployments. If a deploy is already in
# progress, do NOT cancel it — let it finish, then run the next one.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # ── Job 1: CI checks ────────────────────────────────────────────────────────
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Run tests
        run: npx jest --passWithNoTests

      # Build the Docker image to validate the production build in a clean,
      # reproducible environment before handing off to Vercel.
      - name: Build Docker image (production build validation)
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }} \
            -t expense-tracker:${{ github.sha }} \
            .

  # ── Job 2: Deploy to Vercel production ───────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci

    # The "production" GitHub environment enforces required reviewers and
    # provides an auditable deployment history. Configure it in:
    # Settings → Environments → production
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Pull project settings and environment variables from Vercel for
      # the production environment.
      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
